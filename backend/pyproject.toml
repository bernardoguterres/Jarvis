[project]
name = "jarvis-backend"
version = "0.1.0"
description = "Jarvis local controller backend (Phases 1-9: persistence, export/import/backup, Hermes/model integration, local memory, push-to-talk voice, macOS launcher, permissions/hooks/skills, Google Calendar/Fitbit/document integrations)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.14",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "python-multipart>=0.0.12,<0.1",
    "httpx>=0.27,<0.28",
    "faster-whisper>=1.2,<1.3",
    "edge-tts>=7.2,<7.3",
    "keyring>=25.7,<25.8",
    "pypdf>=6.16,<6.17",
    "python-docx>=1.2,<1.3",
]

[project.scripts]
jarvis-cli = "app.cli:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
